<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Финансовый Аналитик</title>
    <!-- Подключаем библиотеку для чтения Excel/CSV и графики Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --accent: #EF3124;
            --bg: #0d0d0e;
            --card-bg: #1c1c1e;
            --text-main: #f5f5f7;
            --text-muted: #8e8e93;
            --border: #2c2c2e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background-color: var(--bg); color: var(--text-main); min-height: 100vh; }
        
        .container { max-width: 520px; margin: 0 auto; padding: 20px 16px 80px; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .header h1 { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
        
        .card { background: var(--card-bg); border-radius: 20px; padding: 20px; margin-bottom: 16px; border: 1px solid var(--border); }
        .card-title { font-size: 14px; color: var(--text-muted); font-weight: 500; margin-bottom: 6px; }
        
        .balance { font-size: 34px; font-weight: 800; color: #fff; }
        .meta-info { font-size: 12px; color: var(--text-muted); margin-top: 6px; }

        /* Зона загрузки файлов */
        .upload-box {
            border: 2px dashed #3a3a3c;
            border-radius: 16px;
            padding: 24px 16px;
            text-align: center;
            cursor: pointer;
            transition: border-color 0.2s, background-color 0.2s;
            margin-bottom: 16px;
            background: rgba(255, 255, 255, 0.02);
        }
        .upload-box:hover, .upload-box.dragover { border-color: var(--accent); background: rgba(239, 49, 36, 0.05); }
        .upload-box input { display: none; }
        .upload-icon { font-size: 32px; margin-bottom: 8px; }
        .upload-title { font-size: 15px; font-weight: 600; margin-bottom: 4px; }
        .upload-desc { font-size: 12px; color: var(--text-muted); }

        .supported-banks { display: flex; gap: 6px; justify-content: center; margin-top: 10px; flex-wrap: wrap; }
        .bank-badge { font-size: 11px; padding: 3px 8px; border-radius: 8px; background: #2c2c2e; color: #ccc; }

        /* График */
        .chart-box { position: relative; height: 230px; width: 100%; margin: 10px 0; }

        /* Список транзакций */
        .tx-list { display: flex; flex-direction: column; gap: 12px; }
        .tx-item { display: flex; justify-content: space-between; align-items: center; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .tx-item:last-child { border-bottom: none; padding-bottom: 0; }
        .tx-left { display: flex; align-items: center; gap: 12px; }
        .tx-icon { width: 38px; height: 38px; border-radius: 10px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; font-size: 18px; }
        .tx-name { font-size: 15px; font-weight: 600; }
        .tx-sub { font-size: 11px; color: var(--text-muted); margin-top: 2px; }
        .tx-amount { font-size: 15px; font-weight: 700; color: #ff5252; text-align: right; }

        .btn-clear { background: transparent; border: 1px solid var(--border); color: var(--text-muted); padding: 8px 12px; border-radius: 10px; font-size: 12px; cursor: pointer; }
        .btn-clear:hover { color: #fff; border-color: #666; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h1>Финансы</h1>
        <button class="btn-clear" onclick="clearData()">Очистить всё</button>
    </div>

    <!-- Загрузка выписки любого банка -->
    <div class="upload-box" id="dropArea" onclick="document.getElementById('fileInput').click()">
        <input type="file" id="fileInput" accept=".csv, .xlsx, .xls" onchange="handleFile(this.files[0])">
        <div class="upload-icon">📄</div>
        <div class="upload-title">Загрузить выписку банка</div>
        <div class="upload-desc">Нажмите или перетащите файл CSV или Excel</div>
        <div class="supported-banks">
            <span class="bank-badge">Альфа-Банк</span>
            <span class="bank-badge">Т-Банк</span>
            <span class="bank-badge">Сбербанк</span>
            <span class="bank-badge">ВТБ</span>
        </div>
    </div>

    <!-- Общая сумма -->
    <div class="card">
        <div class="card-title">Общие расходы по выписке</div>
        <div class="balance" id="totalExpense">0 ₽</div>
        <div class="meta-info" id="fileInfo">Выписка ещё не загружена</div>
    </div>

    <!-- График категорий -->
    <div class="card" id="chartCard" style="display: none;">
        <div class="card-title">Распределение по категориям</div>
        <div class="chart-box">
            <canvas id="categoryChart"></canvas>
        </div>
    </div>

    <!-- Список операций -->
    <div class="card" id="txCard" style="display: none;">
        <div class="card-title" style="margin-bottom: 12px;">Операции</div>
        <div class="tx-list" id="txList"></div>
    </div>
</div>

<script>
    let myChart = null;
    let transactions = [];

    const categoryRules = {
        'Супермаркеты': ['пятерочка', 'магнит', 'перекресток', 'ашан', 'лента', 'спар', 'вкусвилл', 'миндаль', 'пеликан', 'витаград', 'продукты', 'супермаркет'],
        'Фастфуд и Кафе': ['вкусно', 'burger king', 'kfc', 'бургер', 'додо', 'пицца', 'шаурма', 'ростикс', 'ресторан', 'кафе', 'кофе', 'столовая'],
        'Игры и Софт': ['lis-skins', 'majestic', 'steam', 'epic games', 'playstation', 'vk play', 'blizzard'],
        'Подписки и Связь': ['vk music', 'yandex', 'яндекс', 'подписка', 'pure', 'twinby', 'mamba', 'telegram', 'мегафон', 'мтс', 'билайн', 'tele2', 'т-мобайл'],
        'Развлечения': ['mori cinema', 'кино', 'royal forest', 'парк', 'билет', 'театр', 'отдых'],
        'Транспорт': ['яндекс.такси', 'такси', 'каршеринг', 'метро', 'ржд', 'авиа', 'азс', 'бензин', 'лукойл', 'газпромнефть'],
        'Маркетплейсы': ['ozon', 'wildberries', 'вайлдберриз', 'aliexpress', 'мегамаркет', 'яндекс маркет'],
        'Аптеки': ['аптека', 'планета здоровья', 'вита', 'фарм'],
        'Переводы': ['перевод', 'пополнение', 'sbp', 'сбп']
    };

    const icons = {
        'Супермаркеты': '🛒', 'Фастфуд и Кафе': '🍔', 'Игры и Софт': '🎮',
        'Подписки и Связь': '📱', 'Развлечения': '🎬', 'Транспорт': '🚕',
        'Маркетплейсы': '🛍️', 'Аптеки': '💊', 'Переводы': '💸', 'Другое': '💳'
    };

    window.onload = function() {
        const saved = localStorage.getItem('universal_tx_data');
        if (saved) {
            try {
                transactions = JSON.parse(saved);
                renderAll();
            } catch(e) {}
        }
        setupDragAndDrop();
    };

    function setupDragAndDrop() {
        const dropArea = document.getElementById('dropArea');
        ['dragenter', 'dragover'].forEach(e => {
            dropArea.addEventListener(e, (evt) => { evt.preventDefault(); dropArea.classList.add('dragover'); });
        });
        ['dragleave', 'drop'].forEach(e => {
            dropArea.addEventListener(e, (evt) => { evt.preventDefault(); dropArea.classList.remove('dragover'); });
        });
        dropArea.addEventListener('drop', (evt) => {
            const files = evt.dataTransfer.files;
            if (files.length > 0) handleFile(files[0]);
        });
    }

    function handleFile(file) {
        if (!file) return;
        const reader = new FileReader();

        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array', cellDates: true });
            
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            
            // Преобразуем лист в матрицу строк для гибкого парсинга разных шапок
            const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1, defval: '' });
            
            parseBankStatement(rows, file.name);
        };

        reader.readAsArrayBuffer(file);
    }

    // Универсальный разбор формата
    function parseBankStatement(rows, fileName) {
        let headerIndex = -1;
        let colDate = -1, colAmount = -1, colName = -1, colCat = -1;

        // Ищем строку с заголовками таблицы
        for (let i = 0; i < Math.min(rows.length, 25); i++) {
            const row = rows[i].map(c => String(c).toLowerCase().trim());
            
            // Проверка ключевых слов заголовков
            const dateIdx = row.findIndex(c => c.includes('дата') || c.includes('date'));
            const amountIdx = row.findIndex(c => c.includes('сумма') || c.includes('amount') || c.includes('расход'));
            const nameIdx = row.findIndex(c => c.includes('описание') || c.includes('назначение') || c.includes('получатель') || c.includes('место') || c.includes('контрагент'));

            if (dateIdx !== -1 && amountIdx !== -1) {
                headerIndex = i;
                colDate = dateIdx;
                colAmount = amountIdx;
                colName = nameIdx !== -1 ? nameIdx : -1;
                colCat = row.findIndex(c => c.includes('категория') || c.includes('category'));
                break;
            }
        }

        if (headerIndex === -1) {
            alert('Не удалось распознать формат таблицы. Убедитесь, что загружаете стандартную выписку операций из приложения банка.');
            return;
        }

        const newParsed = [];

        for (let i = headerIndex + 1; i < rows.length; i++) {
            const row = rows[i];
            if (!row || row.length <= colAmount) continue;

            let rawAmount = row[colAmount];
            if (rawAmount === undefined || rawAmount === '') continue;

            // Очищаем сумму от пробелов, знаков валюты и преобразуем к float
            let amountStr = String(rawAmount).replace(/\s/g, '').replace('₽', '').replace('RUR', '').replace(',', '.');
            let amount = parseFloat(amountStr);
            if (isNaN(amount)) continue;

            // Нам нужны именно расходы (отрицательные числа в выписках либо явный модуль)
            // Большинство банков пишут расходы со знаком минус (-250.00), некоторые отдельной колонкой
            let isExpense = amount < 0 || String(rawAmount).includes('-');
            amount = Math.abs(amount);

            if (amount === 0) continue;

            let dateVal = row[colDate] || '';
            let dateStr = typeof dateVal === 'object' && dateVal instanceof Date 
                ? dateVal.toLocaleDateString('ru-RU') 
                : String(dateVal).split(' ')[0];

            let description = (colName !== -1 && row[colName]) ? String(row[colName]).trim() : '';
            let bankCategory = (colCat !== -1 && row[colCat]) ? String(row[colCat]).trim() : '';

            let fullText = (description + ' ' + bankCategory).toLowerCase();

            // Автоопределение категории
            let category = 'Другое';
            for (const [catName, keywords] of Object.entries(categoryRules)) {
                if (keywords.some(kw => fullText.includes(kw))) {
                    category = catName;
                    break;
                }
            }

            // Если категория банка уже информативная
            if (category === 'Другое' && bankCategory) {
                category = bankCategory;
            }

            newParsed.push({
                amount: amount,
                name: description || bankCategory || 'Операция',
                category: category,
                date: dateStr
            });
        }

        if (newParsed.length === 0) {
            alert('В файле не найдено записей о расходах.');
            return;
        }

        transactions = newParsed;
        localStorage.setItem('universal_tx_data', JSON.stringify(transactions));
        localStorage.setItem('universal_tx_meta', fileName + ' (' + transactions.length + ' операций)');

        renderAll();
    }

    function renderAll() {
        const meta = localStorage.getItem('universal_tx_meta') || (transactions.length + ' операций');
        document.getElementById('fileInfo').innerText = meta;

        let total = 0;
        const catMap = {};
        let listHtml = '';

        for (let tx of transactions) {
            total += tx.amount;
            catMap[tx.category] = (catMap[tx.category] || 0) + tx.amount;

            const icon = icons[tx.category] || '💳';
            listHtml += `
                <div class="tx-item">
                    <div class="tx-left">
                        <div class="tx-icon">${icon}</div>
                        <div>
                            <div class="tx-name">${escapeHtml(tx.name)}</div>
                            <div class="tx-sub">${escapeHtml(tx.category)} • ${escapeHtml(tx.date)}</div>
                        </div>
                    </div>
                    <div class="tx-amount">-${tx.amount.toLocaleString('ru-RU', {minimumFractionDigits: 2, maximumFractionDigits: 2})} ₽</div>
                </div>
            `;
        }

        document.getElementById('totalExpense').innerText = total.toLocaleString('ru-RU', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' ₽';
        document.getElementById('txList').innerHTML = listHtml;

        document.getElementById('chartCard').style.display = 'block';
        document.getElementById('txCard').style.display = 'block';

        renderChart(catMap);
    }

    function renderChart(catMap) {
        const ctx = document.getElementById('categoryChart').getContext('2d');
        if (myChart) myChart.destroy();

        const labels = Object.keys(catMap);
        const data = Object.values(catMap);

        myChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: labels,
                datasets: [{
                    data: data,
                    backgroundColor: [
                        '#EF3124', '#ff7961', '#ff9800', '#4caf50', 
                        '#2196f3', '#9c27b0', '#e91e63', '#607d8b', '#795548'
                    ],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                cutout: '72%',
                plugins: {
                    legend: {
                        position: 'right',
                        labels: { color: '#f5f5f7', boxWidth: 12, font: { size: 11 } }
                    }
                }
            }
        });
    }

    function clearData() {
        if (!confirm('Очистить загруженные данные?')) return;
        localStorage.removeItem('universal_tx_data');
        localStorage.removeItem('universal_tx_meta');
        transactions = [];
        if (myChart) myChart.destroy();
        document.getElementById('totalExpense').innerText = '0 ₽';
        document.getElementById('fileInfo').innerText = 'Выписка ещё не загружена';
        document.getElementById('chartCard').style.display = 'none';
        document.getElementById('txCard').style.display = 'none';
        document.getElementById('fileInput').value = '';
    }

    function escapeHtml(str) {
        return String(str).replace(/[&<>"']/g, function(m) {
            return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m];
        });
    }
</script>
</body>
</html>
