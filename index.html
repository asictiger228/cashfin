<script>
    let myChart = null;
    let transactions = [];

    const categoryRules = {
        'Супермаркеты': ['пятерочка', 'магнит', 'перекресток', 'ашан', 'лента', 'спар', 'вкусвилл', 'миндаль', 'пеликан', 'витаград', 'продукты'],
        'Фастфуд и Кафе': ['вкусно', 'burger king', 'kfc', 'бургер', 'додо', 'пицца', 'шаурма', 'ростикс', 'ресторан', 'кафе', 'кофе', 'столовая', 'доставка'],
        'Игры и Софт': ['lis-skins', 'majestic', 'steam', 'epic games', 'playstation', 'vk play'],
        'Подписки и Связь': ['vk music', 'yandex', 'яндекс', 'подписка', 'pure', 'twinby', 'mamba', 'telegram', 'мегафон', 'мтс', 'билайн', 'tele2'],
        'Развлечения': ['mori cinema', 'кино', 'royal forest', 'парк', 'билет', 'клуб', 'афиша'],
        'Транспорт': ['яндекс.такси', 'такси', 'каршеринг', 'метро', 'ржд', 'авиа', 'бензин', 'азс', 'лукойл'],
        'Маркетплейсы': ['ozon', 'wildberries', 'aliexpress', 'мегамаркет'],
        'Здоровье': ['аптека', 'планета здоровья', 'вита', 'медицина', 'клиника'],
        'Переводы': ['перевод', 'пополнение', 'sbp', 'сбп']
    };

    const icons = {
        'Супермаркеты': '🛒', 'Фастфуд и Кафе': '🍔', 'Игры и Софт': '🎮',
        'Подписки и Связь': '📱', 'Развлечения': '🎬', 'Транспорт': '🚕',
        'Маркетплейсы': '🛍️', 'Здоровье': '💊', 'Переводы': '💸', 'Другое': '💳'
    };

    window.onload = function() {
        const saved = localStorage.getItem('dzyn_smart_data');
        if (saved) {
            try {
                transactions = JSON.parse(saved);
                if (transactions.length > 0) updateUI();
            } catch(e) {}
        }
    };

    function switchTab(tabId, element) {
        document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        document.getElementById('view-' + tabId).classList.add('active');
        element.classList.add('active');
    }

    function handleFile(file) {
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            const data = new Uint8Array(e.target.result);
            const workbook = XLSX.read(data, { type: 'array', cellDates: true });
            const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1, defval: '' });
            parseBankStatement(rows, file.name);
        };
        reader.readAsArrayBuffer(file);
    }

    function parseBankStatement(rows, fileName) {
        let headerIndex = -1;
        let colDate = -1, colAmount = -1, colName = -1, colCat = -1;
        let isExplicitExpense = false;

        // Ищем строку с заголовками
        for (let i = 0; i < Math.min(rows.length, 30); i++) {
            const row = rows[i].map(c => String(c).toLowerCase().trim());
            const dateIdx = row.findIndex(c => c.includes('дата') || c.includes('date'));
            
            const expIdx = row.findIndex(c => c.includes('расход') || c.includes('списание'));
            const sumIdx = row.findIndex(c => c.includes('сумма') || c.includes('amount'));
            
            const nameIdx = row.findIndex(c => c.includes('описание') || c.includes('назначение') || c.includes('получатель') || c.includes('контрагент') || c.includes('операция'));

            if (dateIdx !== -1 && (expIdx !== -1 || sumIdx !== -1)) {
                headerIndex = i; 
                colDate = dateIdx; 
                
                // Приоритет отдаем колонке "Расход", если она есть
                if (expIdx !== -1) {
                    colAmount = expIdx;
                    isExplicitExpense = true;
                } else {
                    colAmount = sumIdx;
                }
                
                colName = nameIdx !== -1 ? nameIdx : -1;
                colCat = row.findIndex(c => c.includes('категория') || c.includes('category'));
                break;
            }
        }

        if (headerIndex === -1) { alert('Формат выписки не распознан. Убедитесь, что это таблица с операциями.'); return; }

        const newParsed = [];
        for (let i = headerIndex + 1; i < rows.length; i++) {
            const row = rows[i];
            if (!row || row.length <= colAmount) continue;

            let rawAmount = row[colAmount];
            if (rawAmount === undefined || rawAmount === '') continue;

            let amount = parseFloat(String(rawAmount).replace(/\s/g, '').replace('₽', '').replace(',', '.'));
            
            if (isNaN(amount) || amount === 0) continue;

            // Если колонка общая ("Сумма"), фильтруем только числа с минусом
            // Если колонка называется "Расход", берем все числа (банки пишут их там без минуса)
            if (!isExplicitExpense && amount > 0 && !String(rawAmount).includes('-')) {
                continue; 
            }
            
            amount = Math.abs(amount);

            let dateVal = row[colDate] || '';
            let dateStr = typeof dateVal === 'object' ? dateVal.toLocaleDateString('ru-RU') : String(dateVal).split(' ')[0];
            let description = (colName !== -1 && row[colName]) ? String(row[colName]).trim() : '';
            let bankCategory = (colCat !== -1 && row[colCat]) ? String(row[colCat]).trim() : '';
            let fullText = (description + ' ' + bankCategory).toLowerCase();

            let category = 'Другое';
            for (const [catName, keywords] of Object.entries(categoryRules)) {
                if (keywords.some(kw => fullText.includes(kw))) { category = catName; break; }
            }
            if (category === 'Другое' && bankCategory) category = bankCategory;

            newParsed.push({ amount, name: description || bankCategory || 'Операция', category, date: dateStr });
        }

        if (newParsed.length === 0) { alert('Расходов не найдено.'); return; }

        transactions = newParsed;
        localStorage.setItem('dzyn_smart_data', JSON.stringify(transactions));
        localStorage.setItem('dzyn_smart_meta', fileName);
        updateUI();
    }

    function updateUI() {
        if (!transactions.length) return;
        
        document.getElementById('mainCard').style.display = 'block';
        document.getElementById('chartCard').style.display = 'block';
        document.getElementById('fileInfo').innerText = localStorage.getItem('dzyn_smart_meta') + ' (' + transactions.length + ' операций)';

        let total = 0;
        const catMap = {};
        transactions.forEach(tx => {
            total += tx.amount;
            catMap[tx.category] = (catMap[tx.category] || 0) + tx.amount;
        });

        document.getElementById('totalExpense').innerText = total.toLocaleString('ru-RU', {minimumFractionDigits: 2}) + ' ₽';

        const ctx = document.getElementById('categoryChart').getContext('2d');
        if (myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: Object.keys(catMap),
                datasets: [{
                    data: Object.values(catMap),
                    backgroundColor: ['#EF3124', '#ff7961', '#ff9800', '#4caf50', '#2196f3', '#9c27b0', '#e91e63', '#607d8b', '#795548'],
                    borderWidth: 0
                }]
            },
            options: { responsive: true, maintainAspectRatio: false, cutout: '75%', plugins: { legend: { position: 'right', labels: { color: '#fff', boxWidth: 10, font: { size: 10 } } } } }
        });

        updateAnalytics(catMap, total);
        updateFilterDropdown(catMap);
        renderTransactions();
    }

    function updateAnalytics(catMap, total) {
        const sortedCats = Object.entries(catMap).sort((a, b) => b[1] - a[1]);
        
        if (sortedCats.length > 0) {
            const topCat = sortedCats[0];
            const percent = ((topCat[1] / total) * 100).toFixed(1);
            document.getElementById('topCategory').innerText = `${icons[topCat[0]] || '💳'} ${topCat[0]}`;
            document.getElementById('topCategoryPercent').innerText = `${topCat[1].toLocaleString('ru-RU')} ₽ (это ${percent}% от всех трат)`;
        }

        let html = '';
        sortedCats.forEach(([cat, sum]) => {
            const isTarget = ['Фастфуд и Кафе', 'Игры и Софт', 'Подписки и Связь', 'Развлечения', 'Маркетплейсы'].includes(cat);
            html += `
                <div class="savings-item">
                    <input type="checkbox" class="save-cb" value="${sum}" ${isTarget ? 'checked' : ''} onchange="calcSavings()">
                    <label>
                        <span>${icons[cat] || '💳'} ${cat}</span>
                        <span style="font-weight:bold;">${sum.toLocaleString('ru-RU')} ₽</span>
                    </label>
                </div>
            `;
        });
        document.getElementById('savingsList').innerHTML = html;
        calcSavings();
    }

    function calcSavings() {
        let saved = 0;
        document.querySelectorAll('.save-cb:checked').forEach(cb => saved += parseFloat(cb.value));
        document.getElementById('savingsAmount').innerText = '+ ' + saved.toLocaleString('ru-RU', {minimumFractionDigits: 2}) + ' ₽';
    }

    function updateFilterDropdown(catMap) {
        const select = document.getElementById('catFilter');
        select.innerHTML = '<option value="all">Все категории</option>';
        Object.keys(catMap).sort().forEach(cat => {
            select.innerHTML += `<option value="${cat}">${icons[cat] || ''} ${cat}</option>`;
        });
    }

    function renderTransactions() {
        const filter = document.getElementById('catFilter').value;
        const list = document.getElementById('txList');
        let html = '';

        const filtered = filter === 'all' ? transactions : transactions.filter(t => t.category === filter);
        
        filtered.forEach(tx => {
            html += `
                <div class="tx-item">
                    <div class="tx-left">
                        <div class="tx-icon">${icons[tx.category] || '💳'}</div>
                        <div>
                            <div class="tx-name">${escapeHtml(tx.name)}</div>
                            <div class="tx-sub">${escapeHtml(tx.category)} • ${escapeHtml(tx.date)}</div>
                        </div>
                    </div>
                    <div class="tx-amount">-${tx.amount.toLocaleString('ru-RU')} ₽</div>
                </div>
            `;
        });
        list.innerHTML = html || '<div style="text-align:center; color:#888;">Операций не найдено</div>';
    }

    function clearData() {
        if (!confirm('Удалить данные из браузера?')) return;
        localStorage.removeItem('dzyn_smart_data');
        localStorage.removeItem('dzyn_smart_meta');
        location.reload();
    }

    function escapeHtml(str) { return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }
</script>
