<script>
    let myChart = null;
    let transactions = [];

    // База MCC кодов для железобетонного определения
    const mccMap = {
        // Супермаркеты и продукты
        '5411': 'Супермаркеты', '5499': 'Супермаркеты', '5422': 'Супермаркеты', '5462': 'Супермаркеты',
        // Фастфуд и рестораны
        '5814': 'Фастфуд и Кафе', '5812': 'Фастфуд и Кафе', '5811': 'Фастфуд и Кафе', '5813': 'Фастфуд и Кафе',
        // Транспорт, такси, каршеринг, АЗС
        '4121': 'Транспорт', '4111': 'Транспорт', '4131': 'Транспорт', '4789': 'Транспорт', '5541': 'Транспорт', '5542': 'Транспорт', '7512': 'Транспорт',
        // Связь, интернет, подписки
        '4814': 'Подписки и Связь', '4812': 'Подписки и Связь', '4899': 'Подписки и Связь', '5192': 'Подписки и Связь',
        // Развлечения, кино, парки
        '7999': 'Развлечения', '7832': 'Развлечения', '7922': 'Развлечения', '7996': 'Развлечения',
        // Аптеки и медицина
        '5912': 'Здоровье', '8011': 'Здоровье', '8099': 'Здоровье', '8062': 'Здоровье', '8043': 'Здоровье',
        // Маркетплейсы, одежда, онлайн-магазины
        '5300': 'Маркетплейсы', '5311': 'Маркетплейсы', '5399': 'Маркетплейсы', '5262': 'Маркетплейсы', '5999': 'Маркетплейсы', '5691': 'Маркетплейсы',
        // Игры и софт
        '5732': 'Игры и Софт', '5815': 'Игры и Софт', '5816': 'Игры и Софт', '7994': 'Игры и Софт'
    };

    // Правила по ключевым словам (если MCC нет или он неизвестен)
    const categoryRules = {
        'Супермаркеты': ['пятерочка', 'магнит', 'перекресток', 'ашан', 'лента', 'спар', 'вкусвилл', 'миндаль', 'пеликан', 'витаград', 'продукты', 'супермаркет', 'самокат', 'samokat'],
        'Фастфуд и Кафе': ['вкусно', 'burger king', 'kfc', 'бургер', 'додо', 'пицца', 'шаурма', 'ростикс', 'ресторан', 'кафе', 'кофе', 'столовая', 'доставка', 'eda', 'еда', 'yandex eda'],
        'Транспорт': ['яндекс.такси', 'такси', 'taxi', 'fasten', 'yandex go', 'каршеринг', 'метро', 'ржд', 'авиа', 'бензин', 'азс', 'лукойл', 'газпром', 'драйв', 'drive'],
        'Игры и Софт': ['lis-skins', 'majestic', 'steam', 'epic games', 'playstation', 'vk play', 'blizzard', 'digital goods'],
        'Развлечения': ['mori cinema', 'кино', 'royal forest', 'парк', 'билет', 'клуб', 'афиша', 'кинотеатр'],
        'Маркетплейсы': ['ozon', 'wildberries', 'вайлдберриз', 'aliexpress', 'мегамаркет', 'market', 'яндекс маркет'],
        'Здоровье': ['аптека', 'планета здоровья', 'вита', 'медицина', 'клиника', 'инвитро', 'фарм'],
        'Подписки и Связь': ['vk music', 'yandex', 'яндекс', 'подписка', 'pure', 'twinby', 'твинби', 'mamba', 'telegram', 'мегафон', 'мтс', 'билайн', 'tele2', 'знакомства'],
        'Переводы': ['перевод', 'пополнение', 'sbp', 'сбп']
    };

    const icons = {
        'Супермаркеты': '🛒', 'Фастфуд и Кафе': '🍔', 'Игры и Софт': '🎮',
        'Подписки и Связь': '📱', 'Развлечения': '🎬', 'Транспорт': '🚕',
        'Маркетплейсы': '🛍️', 'Здоровье': '💊', 'Переводы': '💸', 'Другое': '💳'
    };

    window.onload = function() {
        const saved = localStorage.getItem('dzyn_smart_data');
        if (saved) {
            try {
                transactions = JSON.parse(saved);
                if (transactions.length > 0) updateUI();
            } catch(e) {}
        }
    };

    function switchTab(tabId, element) {
        document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
        document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
        document.getElementById('view-' + tabId).classList.add('active');
        element.classList.add('active');
    }

    // УМНЫЙ ДЕТЕКТОР (Сначала ищет MCC код, если не нашел - ищет по словам)
    function detectCategory(text) {
        let fullText = text.toLowerCase();
        
        // Пытаемся вытащить 4 цифры, если они похожи на MCC (например "mcc 4121" или просто "4121")
        let mccMatch = fullText.match(/(?:mcc\s*:?\s*)?(\d{4})/i);
        if (mccMatch) {
            let code = mccMatch[1];
            if (mccMap[code]) {
                return mccMap[code];
            }
        }

        // Если MCC нет или он неизвестен, идем по ключевым словам
        for (const [catName, keywords] of Object.entries(categoryRules)) {
            if (keywords.some(kw => fullText.includes(kw))) return catName;
        }
        return 'Другое';
    }

    function cleanNumber(val) {
        if (!val) return NaN;
        if (typeof val === 'number') return val;
        let s = String(val).replace(/[\s\u00A0\u2007\u202F\+]/g, '').replace('₽', '').replace('RUR', '').replace('RUB', '').replace(',', '.');
        return parseFloat(s);
    }

    async function handleFile(file) {
        if (!file) return;
        const bank = document.getElementById('bankSelect').value;
        const ext = file.name.split('.').pop().toLowerCase();

        if (ext === 'pdf') {
            const reader = new FileReader();
            reader.onload = async function(e) {
                try {
                    const typedarray = new Uint8Array(e.target.result);
                    const pdf = await pdfjsLib.getDocument(typedarray).promise;
                    let fullText = '';
                    for (let i = 1; i <= pdf.numPages; i++) {
                        const page = await pdf.getPage(i);
                        const textContent = await page.getTextContent();
                        fullText += textContent.items.map(item => item.str).join(' ') + '\n';
                    }
                    if (bank === 'sber' || bank === 'auto') parseSberPDF(fullText, file.name);
                    else if (bank === 'yandex') parseYandexPDF(fullText, file.name);
                    else parseSberPDF(fullText, file.name);
                } catch (err) { alert('Ошибка чтения PDF: ' + err.message); }
            };
            reader.readAsArrayBuffer(file);
            return;
        }

        if (ext === 'txt') {
            const reader = new FileReader();
            reader.onload = function(e) { parseTinkoffTXT(e.target.result, file.name); };
            reader.readAsText(file);
            return;
        }

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                const data = new Uint8Array(e.target.result);
                const workbook = XLSX.read(data, { type: 'array', cellDates: true, raw: false });
                const rows = XLSX.utils.sheet_to_json(workbook.Sheets[workbook.SheetNames[0]], { header: 1, defval: '' });
                parseUniversalExcel(rows, file.name, bank);
            } catch (err) { alert('Ошибка чтения Excel/CSV: ' + err.message); }
        };
        reader.readAsArrayBuffer(file);
    }

    function parseSberPDF(text, fileName) {
        const newParsed = [];
        const cleanText = text.replace(/\s+/g, ' ');
        const chunks = cleanText.split(/(?=\d{2}\.\d{2}\.\d{4})/);

        for (let chunk of chunks) {
            const dateMatch = chunk.match(/^(\d{2}\.\d{2}\.\d{4})/);
            if (!dateMatch) continue;
            const date = dateMatch[1];

            if (chunk.includes('+') || chunk.toLowerCase().includes('пополнение')) continue;

            const amtMatch = chunk.match(/(\d{1,3}(?:[ \u00A0]\d{3})*,\d{2})/g);
            if (amtMatch && amtMatch.length > 0) {
                let amount = parseFloat(amtMatch[0].replace(/[\s\u00A0]/g, '').replace(',', '.'));
                if (amount === 0) continue;

                let desc = chunk.replace(date, '').replace(amtMatch[0], '').trim();
                desc = desc.replace(/^[\d:]+\s*/, '').replace(/^\d+\s*/, '').slice(0, 60).trim();

                newParsed.push({ amount, name: desc || 'Операция', category: detectCategory(desc), date, cashback: 0 });
            }
        }
        if (newParsed.length === 0) { alert('Расходов в Сбер PDF не найдено.'); return; }
        saveAndRender(newParsed, fileName);
    }

    function parseYandexPDF(text, fileName) {
        const expenseMatch = text.match(/Всего расходных операций[\s|]+([\d\s]+,\d{2})/i);
        if (expenseMatch) {
            let amount = parseFloat(expenseMatch[1].replace(/[\s\u00A0]/g, '').replace(',', '.'));
            saveAndRender([{ amount, name: 'Сводка расходов Яндекс Пэй', category: 'Другое', date: new Date().toLocaleDateString('ru-RU'), cashback: 0 }], fileName);
        } else alert('Не удалось найти расходы в PDF Яндекс Пэй.');
    }

    function parseTinkoffTXT(text, fileName) {
        const expenseMatch = text.match(/Расходы:\s*(?:−|-)?\s*([\d\s\u00A0]+(?:,\d{2})?)/i);
        if (expenseMatch) {
            let amount = parseFloat(expenseMatch[1].replace(/[\s\u00A0]/g, '').replace(',', '.'));
            saveAndRender([{ amount, name: 'Т-Банк: Расходы за месяц', category: 'Другое', date: new Date().toLocaleDateString('ru-RU'), cashback: 0 }], fileName);
        } else alert('Не найдены расходы в TXT файле Т-Банка.');
    }

    function parseUniversalExcel(rows, fileName, bankId) {
        let headerIndex = -1;
        let cols = { date: -1, amount: -1, type: -1, exp: -1, name: -1, cat: -1, cashback: -1 };

        for (let i = 0; i < Math.min(rows.length, 150); i++) {
            const row = rows[i].map(c => String(c).toLowerCase().trim());
            if (row.length < 2) continue;

            const dIdx = row.findIndex(c => c.includes('дата') || c.includes('date') || c.includes('время'));
            const tIdx = row.findIndex(c => c === 'тип' || c === 'тип операции');
            const eIdx = row.findIndex(c => c === 'расход' || c === 'списание' || c === 'дебет');
            const sIdx = row.findIndex(c => c.includes('сумма') || c.includes('amount'));
            const nIdx = row.findIndex(c => c.includes('описание') || c.includes('назначение') || c.includes('получатель') || c.includes('операция'));
            const cIdx = row.findIndex(c => c.includes('кэшбэк') || c.includes('кешбэк') || c.includes('бонус') || c.includes('начислено'));

            if (dIdx !== -1 && (sIdx !== -1 || eIdx !== -1)) {
                headerIndex = i;
                cols.date = dIdx;
                cols.type = tIdx;
                cols.exp = eIdx;
                cols.amount = (eIdx !== -1) ? eIdx : sIdx;
                cols.name = nIdx;
                cols.cat = row.findIndex(c => c.includes('категория') || c.includes('mcc'));
                cols.cashback = cIdx;
                break;
            }
        }

        const newParsed = [];

        if (headerIndex !== -1) {
            for (let i = headerIndex + 1; i < rows.length; i++) {
                const row = rows[i];
                if (!row || row.length <= cols.amount) continue;

                let rawAmount = row[cols.amount];
                let num = cleanNumber(rawAmount);
                if (isNaN(num) || num === 0) continue;

                let typeVal = cols.type !== -1 ? String(row[cols.type]).toLowerCase() : '';
                let isExplicitExpenseByColumnType = typeVal.includes('списание') || typeVal.includes('расход') || typeVal.includes('оплата') || typeVal.includes('покупка');
                
                if (!isExplicitExpenseByColumnType && cols.type !== -1 && (typeVal.includes('пополнение') || typeVal.includes('приход'))) continue; 
                if (cols.type === -1 && cols.exp === -1 && num > 0 && !String(rawAmount).includes('-')) continue;

                let amount = Math.abs(num);
                let dateVal = row[cols.date] || '';
                let dateStr = typeof dateVal === 'object' && dateVal instanceof Date ? dateVal.toLocaleDateString('ru-RU') : String(dateVal).split(' ')[0];
                let description = (cols.name !== -1 && row[cols.name]) ? String(row[cols.name]).trim() : '';
                let bankCategory = (cols.cat !== -1 && row[cols.cat]) ? String(row[cols.cat]).trim() : '';
                
                let cashbackVal = 0;
                if (cols.cashback !== -1 && row[cols.cashback]) {
                    let cbNum = cleanNumber(row[cols.cashback]);
                    if (!isNaN(cbNum) && cbNum > 0) cashbackVal = cbNum;
                }

                // Передаем всё содержимое строки, чтобы детектор нашел MCC-код (даже если он записан в описании)
                newParsed.push({
                    amount,
                    name: description || bankCategory || 'Покупка',
                    category: detectCategory(description + ' ' + bankCategory),
                    date: dateStr,
                    cashback: cashbackVal
                });
            }
        }

        if (newParsed.length === 0) {
            alert('Расходов в таблице не найдено. Проверьте формат.');
            return;
        }

        saveAndRender(newParsed, fileName);
    }

    function saveAndRender(dataArray, fileName) {
        transactions = dataArray;
        localStorage.setItem('dzyn_smart_data', JSON.stringify(transactions));
        localStorage.setItem('dzyn_smart_meta', fileName);
        updateUI();
    }

    function updateUI() {
        if (!transactions.length) return;
        
        document.getElementById('mainCard').style.display = 'block';
        document.getElementById('chartCard').style.display = 'block';
        document.getElementById('fileInfo').innerText = (localStorage.getItem('dzyn_smart_meta') || 'Файл') + ' (' + transactions.length + ' операций)';

        let total = 0, totalCashback = 0;
        const catMap = {};
        
        transactions.forEach(tx => {
            total += tx.amount;
            totalCashback += (tx.cashback || 0);
            catMap[tx.category] = (catMap[tx.category] || 0) + tx.amount;
        });

        document.getElementById('totalExpense').innerText = total.toLocaleString('ru-RU', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' ₽';

        if (totalCashback > 0) {
            document.getElementById('cashbackBox').style.display = 'block';
            document.getElementById('totalCashback').innerText = '+ ' + totalCashback.toLocaleString('ru-RU', {minimumFractionDigits: 2}) + ' ₽';
        } else {
            document.getElementById('cashbackBox').style.display = 'none';
        }

        const ctx = document.getElementById('categoryChart').getContext('2d');
        if (myChart) myChart.destroy();
        myChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: Object.keys(catMap),
                datasets: [{
                    data: Object.values(catMap),
                    backgroundColor: ['#EF3124', '#ff7961', '#ff9800', '#4caf50', '#2196f3', '#9c27b0', '#e91e63', '#607d8b', '#795548', '#00bcd4'],
                    borderWidth: 0
                }]
            },
            options: { responsive: true, maintainAspectRatio: false, cutout: '75%', plugins: { legend: { position: 'right', labels: { color: '#fff', boxWidth: 10, font: { size: 10 } } } } }
        });

        updateAnalytics(catMap, total);
        updateFilterDropdown(catMap);
        renderTransactions();
    }

    function updateAnalytics(catMap, total) {
        const sortedCats = Object.entries(catMap).sort((a, b) => b[1] - a[1]);
        if (sortedCats.length > 0) {
            const topCat = sortedCats[0];
            const percent = ((topCat[1] / total) * 100).toFixed(1);
            document.getElementById('topCategory').innerText = `${icons[topCat[0]] || '💳'} ${topCat[0]}`;
            document.getElementById('topCategoryPercent').innerText = `${topCat[1].toLocaleString('ru-RU')} ₽ (${percent}% бюджета)`;
        }

        let html = '';
        sortedCats.forEach(([cat, sum]) => {
            const isTarget = ['Фастфуд и Кафе', 'Игры и Софт', 'Подписки и Связь', 'Развлечения', 'Маркетплейсы'].includes(cat);
            html += `
                <div class="savings-item">
                    <input type="checkbox" class="save-cb" value="${sum}" ${isTarget ? 'checked' : ''} onchange="calcSavings()">
                    <label>
                        <span>${icons[cat] || '💳'} ${cat}</span>
                        <span style="font-weight:bold;">${sum.toLocaleString('ru-RU')} ₽</span>
                    </label>
                </div>
            `;
        });
        document.getElementById('savingsList').innerHTML = html;
        calcSavings();
    }

    function calcSavings() {
        let saved = 0;
        document.querySelectorAll('.save-cb:checked').forEach(cb => saved += parseFloat(cb.value));
        document.getElementById('savingsAmount').innerText = '+ ' + saved.toLocaleString('ru-RU', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' ₽';
    }

    function updateFilterDropdown(catMap) {
        const select = document.getElementById('catFilter');
        select.innerHTML = '<option value="all">Все категории</option>';
        Object.keys(catMap).sort().forEach(cat => { select.innerHTML += `<option value="${cat}">${icons[cat] || ''} ${cat}</option>`; });
    }

    function renderTransactions() {
        const filter = document.getElementById('catFilter').value;
        const list = document.getElementById('txList');
        let html = '';
        const filtered = filter === 'all' ? transactions : transactions.filter(t => t.category === filter);
        filtered.forEach(tx => {
            let cbHtml = tx.cashback > 0 ? `<div class="tx-cashback">+${tx.cashback} ₽ кэшбэк</div>` : '';
            html += `
                <div class="tx-item">
                    <div class="tx-left">
                        <div class="tx-icon">${icons[tx.category] || '💳'}</div>
                        <div>
                            <div class="tx-name">${escapeHtml(tx.name)}</div>
                            <div class="tx-sub">${escapeHtml(tx.category)} • ${escapeHtml(tx.date)}</div>
                            ${cbHtml}
                        </div>
                    </div>
                    <div class="tx-amount">-${tx.amount.toLocaleString('ru-RU', {minimumFractionDigits: 2})} ₽</div>
                </div>
            `;
        });
        list.innerHTML = html || '<div style="text-align:center; color:#888;">Операций не найдено</div>';
    }

    function clearData() {
        if (!confirm('Очистить загруженные данные?')) return;
        localStorage.removeItem('dzyn_smart_data');
        localStorage.removeItem('dzyn_smart_meta');
        location.reload();
    }

    function escapeHtml(str) { return String(str).replace(/[&<>"']/g, m => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[m])); }
</script>
