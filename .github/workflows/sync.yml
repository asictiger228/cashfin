name: Sync VK Transactions

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Скачивание репозитория
        uses: actions/checkout@v4

      - name: Установка Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Установка библиотек
        run: pip install requests

      - name: Запуск парсера ВК
        env:
          VK_TOKEN: ${{ secrets.VK_TOKEN }}
        run: python sync.py

      - name: Автоматический коммит данных
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Авто-обновление чеков из ВК"
          file_pattern: 'data.json'
